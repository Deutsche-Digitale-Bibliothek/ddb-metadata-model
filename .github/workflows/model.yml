name: Model

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.1+8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
      - name: Install pinned Maven
        run: python .github/scripts/install_maven.py
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Record source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Jena syntax, structure and rule tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build documentation and reports, including failed-test evidence
        if: ${{ !cancelled() }}
        run: python scripts/build_docs.py
      - name: Check reference coverage, links, diagrams and publication boundaries
        if: ${{ !cancelled() }}
        run: python scripts/check_docs.py
      - name: Verify documentation builds reproducibly
        run: python .github/scripts/check_reproducibility.py
      - name: Build release archive
        if: ${{ success() && github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/release_assets.py bundle
      - name: Preserve documentation, RDF and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/site/
            target/reports/
            target/surefire-reports/
      - name: Preserve release downloads
        if: ${{ success() && github.event_name == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-downloads
          if-no-files-found: error
          path: target/release/
      - name: Prepare Pages artifact
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  pages:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  release:
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-downloads
          path: target/release
      - name: Attach versioned documentation and downloads without overwriting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py upload
